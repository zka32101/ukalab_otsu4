name: Regen pubspec.lock (temporary)

on:
  push:
    branches: [chore/commit-pubspec-lock]
    paths: ['.github/workflows/regen_lock.yml']

permissions:
  contents: write

jobs:
  regen:
    # bot が push したコミットでは再実行しない（念のため）
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Commit pubspec.lock
        run: |
          if [ -f pubspec.lock ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            if git diff --cached --quiet; then
              echo "No lock changes"
            else
              git commit -m "chore: add pubspec.lock generated with Flutter 3.35.5"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi
