name: tmp-relock
on:
  push:
    branches: [chore/ukalab-core-v0.87.0]
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - run: git diff --stat pubspec.lock; git diff pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: lock
          path: pubspec.lock
