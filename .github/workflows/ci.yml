name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web 対応を追加（リポジトリに web/ が無いため）
        run: flutter create --platforms=web .
      - name: Build (web)
        run: |
          flutter pub get
          flutter build web
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Serve and check
        env:
          E2E_SETTINGS: '購入'
          E2E_EXAM_DATE: ''
          E2E_HOME: 'うかラボ 危険物乙4,今日やること,記録,試験に向けて'
          E2E_LEARN: '学習ツール一覧,道具,間違いノート,用語集,章ごとの解説読み物'
          E2E_READING: '章ごとの解説読み物|危険物とは何か|消防法上の危険物'
        run: |
          (cd build/web && python3 -m http.server 8099 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8099/ >/dev/null && break; sleep 1; done
          mkdir -p e2e/shots
          node e2e/check.js e2e/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/shots
