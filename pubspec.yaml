name: otsu4
description: "うかラボ 危険物乙4 - 危険物取扱者乙種（乙1〜乙6対応）学習アプリ"
publish_to: "none"
version: 0.1.3+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0

  # うかラボ共通基盤（タグ固定。main は参照しない）
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v3.11.0
  ukalab_core:
    git:
      url: https://github.com/zka32101/ukalab_core.git
      ref: v0.78.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/exam/
    - assets/icon/app_icon_256.png
    - assets/features/
    - assets/questions/
    - assets/readings.jsonl

# アプリアイコン（Android）。素材は images/うかラボ/アイコン/02_完成(最終)。
# 反映: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#C23D16"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

# shared_preferences_android 2.5.0 は Android で起動時に NoSuchMethodError となり、起動画面から進まない(実機で確認)。他アプリと同じ 2.4.x に固定する。
dependency_overrides:
  shared_preferences_android: 2.4.23
