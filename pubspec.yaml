name: otsu4
description: "うかラボ 危険物乙4 - 危険物取扱者乙種（乙1〜乙6対応）学習アプリ"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0

  # うかラボ共通基盤（タグ固定。main は参照しない）
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v3.0.0
  ukalab_core:
    git:
      url: https://github.com/zka32101/ukalab_core.git
      ref: v0.53.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/exam/
    - assets/questions/
