name: otsu4
description: "うかラボ 危険物乙4 - 危険物取扱者乙種（乙1〜乙6対応）学習アプリ"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0

  # うかラボ共通基盤（タグ固定。main は参照しない）
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v3.0.0
  ukalab_core:
    git:
      url: https://github.com/zka32101/ukalab_core.git
      ref: v0.53.0

  # 相互紹介（クロスプロモーション）。Remote Config で配信する掲載リストを設定画面に表示する。
  # cross_promo_kit はタグ固定（main は参照しない）。firebase_* は kit の許容レンジ
  # （firebase_remote_config >=4.0.0 <7.0.0）と ukalab_core の cloud_firestore（>=5 <7）の両方を満たす範囲。
  firebase_core: ">=4.0.0 <5.0.0"
  firebase_remote_config: ">=6.0.0 <7.0.0"
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit
      ref: v0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/exam/
    - assets/questions/
    - assets/readings.jsonl
